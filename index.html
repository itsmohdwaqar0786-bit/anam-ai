<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    .title {
      text-align: center;
      margin-top: 20px;
    }

    .title h1 {
      font-size: 38px;
      margin: 0;
    }

    .title p {
      color: #aaa;
      margin-top: 8px;
    }

    #chat {
      margin-top: 30px;
      min-height: 300px;
      padding: 15px;
      border-radius: 18px;
      background: #1b1b1b;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
    }

    .anam {
      background: #292929;
    }

    .user {
      background: #3b3b3b;
      text-align: right;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    #textInput {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      border-radius: 15px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    #send {
      width: 55px;
      border: none;
      border-radius: 15px;
      font-size: 22px;
    }

    #mic {
      display: block;
      margin: 22px auto 0;
      width: 75px;
      height: 75px;
      border: none;
      border-radius: 50%;
      font-size: 32px;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="title">
      <h1>ANAM AI</h1>
      <p>Your personal AI assistant</p>
    </div>

    <div id="chat">

      <div class="message anam">
        👋 Hello! Main Anam AI hoon.<br>
        Mujhse baat karo.
      </div>

    </div>

    <div class="controls">

      <input
        id="textInput"
        type="text"
        placeholder="Kuch likho..."
      >

      <button id="send">➤</button>

    </div>

    <button id="mic">🎙️</button>

    <div id="status">
      Microphone dabakar bolo
    </div>

  </div>


<script>

const chat = document.getElementById("chat");
const input = document.getElementById("textInput");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const status = document.getElementById("status");


function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.innerText = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


function sendMessage() {

  const text = input.value.trim();

  if (text === "") {
    return;
  }

  addMessage(text, "user");

  input.value = "";

  setTimeout(function() {

    addMessage(
      "🤖 Main Anam AI hoon. Abhi mera AI brain connect nahi hua hai. Agle step mein hum mujhe intelligent banayenge.",
      "anam"
    );

  }, 500);
}


send.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    sendMessage();

  }

});


mic.addEventListener("click", function() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    status.innerText =
      "❌ Is browser mein voice recognition available nahi hai.";

    return;
  }


  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  status.innerText =
    "🎧 Anam AI sun raha hai...";


  recognition.start();


  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    status.innerText =
      "✅ Maine sun liya.";

    sendMessage();

  };


  recognition.onerror = function(event) {

    status.innerText =
      "❌ Voice error: " + event.error;

  };


  recognition.onend = function() {

    if (status.innerText === "🎧 Anam AI sun raha hai...") {

      status.innerText =
        "Microphone dabakar dobara bolo";

    }

  };

});

</script>

</body>
</html>
